<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Path game</title>
		<link rel="manifest" href="/manifest.json">
  </head>
  <body>
    <div id="TelaInicial" class="tela">
      <div id="btnStart" class="btnGlobal" onclick="mudarTela('TelaSelect')">START</div>
    </div>
    
    <div id="TelaSelect" class="tela oculto">
      <div id="iconCharacters" class="">
				<div id="seleçãoP1" class="SeleçãoIcone">1</div>
				<div id="seleçãoP2" class="SeleçãoIcone">2</div>
				<div id="seleçãoP4" class="SeleçãoIcone">3</div>
				<div id="seleçãoP4" class="SeleçãoIcone">4</div>
			</div>
      <div id="btnProx" class="btnsPA" onclick="SelecaoDePeraonagem('avancar')">></div>
      <div id="btnAnter" class="btnsPA" onclick="SelecaoDePeraonagem('voltar')"><</div>
      <div id="iconPerso" class="">1</div>
      <div id="botaoSelect" class="btnGlobal" onclick="mudarTela('TelaSkillsEPassivas')">ESCOLHER</div>
    </div>

		<div id="TelaSkillsEPassivas" class="tela oculto">
			<div id="BoxPassivasTitle" class="Boxes">HABILIDADES INICIAIS</div>
			<div id="BoxPassivas" class="">
				<div data-id="Passiva1" class="PassivasP"></div>
				<div data-id="Passiva2" class="PassivasP"></div>
				<div data-id="Passiva3" class="PassivasP"></div>
			</div>
			
			<div id="BoxBaralhoTitle" class="Boxes">CARTAS INICIAIS</div>
			<div id="BoxBaralho" class="Boxes">
				<div id="PriCarta" class="Cards"></div>
				<div id="SegCarta" class="Cards"></div>
				<div id="TriCarta" class="Cards"></div>
				<div id="QuarCarta" class="Cards"></div>
				<div id="QuinCarta" class="Cards"></div>
				<div id="SextCarta" class="Cards"></div>
				<div id="SetimaCarta" class="Cards"></div>
				<div id="OitCarta" class="Cards"></div>
				<div id="NonaCarta" class="Cards"></div>
			</div>
			
			<div id="BoxBotoes">
				<div id="btnPersonagens" class="btnGlobal" onclick="mudarTela('TelaSelect')">< PERSONAGENS</div>
				<div id="btnGame" class="btnGlobal" onclick="mudarTela('TelaPrincipal')">COMEÇAR ></div>
			</div>
			
			<div id="PopUpskillaCards" class="oculto" onclick="DesativarPopUp()">
				<div id="PopUpSC">
					<div id="linhaSprites" class=""></div>
					<div id="linhaInfos" class=""></div>
				</div>
			</div>
		</div>

		<div id="TelaPrincipal" class="tela oculto">
			<div id="TopBar" class="">
			 <div id="btn1" class="btnBar">Level: 100</div>
			 <div id="btn2" class="btnBar">Andar: 99</div>
			 <div id="btn3" class="btnBar">Gold: 1000</div>
			</div>
			<div id="fundoImg" class="imagemStyle"></div>
			<div id="Hotbar" class="">
			 <div id="btn1" class="btnBar">perfil</div>
			 <div id="btn2" class="btnBar">Cartas</div>
			 <div id="btn3" class="btnBar" onclick="mudarTela('TelaBatalha')">Batalhar</div>
			 <div id="btn4" class="btnBar">Lojas</div>
		 </div>
		</div>
		
		<div id="TelaBatalha" class="tela oculto">
			<div id="RowInimigo" class=""></div>
			<div id="RowTabuleiro" class="">
				<div id="PosicoesEnemy" class="">
					<div id="PosicaoT1" class="PosiçõesT"></div>
					<div id="PosicaoT2" class="PosiçõesT"></div>
					<div id="PosicaoT3" class="PosiçõesT"></div>
					<div id="PosicaoT4" class="PosiçõesT"></div>
					<div id="PosicaoT5" class="PosiçõesT"></div>
					<div id="PosicaoT6" class="PosiçõesT"></div>
				</div>
				<div id="Bar">
				<div id="PosicoesAliado" class="">
					<div id="PosicaoT7" class="PosiçõesT"></div>
					<div id="PosicaoT8" class="PosiçõesT"></div>
					<div id="PosicaoT9" class="PosiçõesT"></div>
					<div id="PosicaoT10" class="PosiçõesT"></div>
					<div id="PosicaoT11" class="PosiçõesT"></div>
					<div id="PosicaoT12" class="PosiçõesT"></div>
				</div>
			</div>
			<div id="RowPlayer" class=""></div>
		</>
  </body>
  <script type="module" src="/src/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
</html>
